<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: radial-gradient(ellipse at 30% 0%, #3d1350 0%, #24082e 40%, #12040d 100%);
    color: #ffffff;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: linear-gradient(135deg, #24082e 60%, #3d1350 100%);
    border-bottom: 2px solid #ff2882;
  }
  .back-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 800; }
  .sub { font-size: 10px; color: #ff7ac6; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-top: 2px; }
  main {
    padding: 24px 18px;
    color: #b79ecf;
    font-size: 13px;
  }
</style>
</head>
<body>
  <header>
    <a class="back-btn" href="index.html">Back</a>
    <div>
